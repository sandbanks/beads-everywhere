{{ define "issue_modal.html" }}
<dialog id="new-issue-modal" class="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 p-0 shadow-2xl backdrop:bg-black/60 backdrop:backdrop-blur-sm max-w-lg w-full m-auto">
	<div class="p-6">
		<div class="flex items-center justify-between pb-4 mb-4 border-b border-zinc-200 dark:border-zinc-800">
			<div class="flex items-center gap-2">
				<span class="text-xl">🐝</span>
				<h2 class="text-base font-bold text-zinc-900 dark:text-zinc-100">Universal Bead Creator</h2>
			</div>
			<button onclick="document.getElementById('new-issue-modal').close()" class="text-zinc-400 hover:text-zinc-600 dark:text-zinc-500 dark:hover:text-zinc-300 transition-colors p-1">
				<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
				</svg>
			</button>
		</div>

		<form
			hx-post="/issues"
			hx-target="#issues-container"
			hx-swap="outerHTML"
			hx-on::after-request="if(event.detail.successful) { document.getElementById('new-issue-modal').close(); this.reset(); }"
			class="space-y-4"
		>
			<div>
				<label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Target Project</label>
				<select
					name="repo"
					required
					class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:border-amber-500 text-sm text-zinc-900 dark:text-zinc-200 outline-none transition-all"
				>
					{{ range .Projects }}
					<option value="{{ .Name }}" {{ if eq .Name $.DefaultRepo }}selected{{ end }}>
						📁 {{ .Name }} ({{ .Path }})
					</option>
					{{ end }}
				</select>
			</div>

			<div>
				<label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Title</label>
				<input
					type="text"
					name="title"
					required
					placeholder="What needs to be done?"
					class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition-all"
				/>
			</div>

			<div>
				<label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Description (optional)</label>
				<textarea
					name="description"
					rows="3"
					placeholder="Add context, acceptance criteria, or notes..."
					class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition-all resize-none"
				></textarea>
			</div>

			<div class="grid grid-cols-2 gap-3">
				<div>
					<label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Priority</label>
					<select
						name="priority"
						class="w-full px-3 py-2 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:border-amber-500 text-sm text-zinc-900 dark:text-zinc-200 outline-none"
					>
						<option value="0">P0 - Critical 🔥</option>
						<option value="1">P1 - High ⚡️</option>
						<option value="2" selected>P2 - Normal 📌</option>
						<option value="3">P3 - Low 💤</option>
						<option value="4">P4 - Backlog 📋</option>
					</select>
				</div>

				<div>
					<label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Type</label>
					<select
						name="issue_type"
						class="w-full px-3 py-2 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:border-amber-500 text-sm text-zinc-900 dark:text-zinc-200 outline-none"
					>
						<option value="task" selected>Task</option>
						<option value="feature">Feature</option>
						<option value="bug">Bug</option>
						<option value="chore">Chore</option>
						<option value="epic">Epic</option>
					</select>
				</div>
			</div>

			<div class="pt-3 flex items-center justify-end gap-2">
				<button
					type="button"
					onclick="document.getElementById('new-issue-modal').close()"
					class="px-4 py-2 text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 bg-zinc-100 dark:bg-zinc-800/40 hover:bg-zinc-200 dark:hover:bg-zinc-800 rounded-xl transition-colors"
				>
					Cancel
				</button>
				<button
					type="submit"
					class="px-5 py-2 text-xs font-semibold text-zinc-950 bg-gradient-to-r from-amber-400 to-amber-300 hover:from-amber-300 hover:to-amber-200 rounded-xl shadow-md shadow-amber-500/20 transition-all"
				>
					Create Bead ⚡️
				</button>
			</div>
		</form>
	</div>
</dialog>
{{ end }}
